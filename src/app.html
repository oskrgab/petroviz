<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%232ecc71' width='32' height='32' rx='4'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>V</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="petroviz: explore petrodb's open petroleum datasets, production and well logs, in your browser"
    />
    <!--
      Umami. The website id is the build's PUBLIC_UMAMI_WEBSITE_ID (the deploy
      sets it from a GitHub variable); without one, no tracker loads. Page views
      count on the production hostnames only (data-domains). An opened LAS file
      puts its file name in the query and its well and file names in the title,
      so the query is never sent (data-exclude-search) and the title is dropped
      before sending (data-before-send). src/app.test.js holds all of this.
    -->
    <script data-website-id="%sveltekit.env.PUBLIC_UMAMI_WEBSITE_ID%">
      (function (loader) {
        var id = loader.getAttribute('data-website-id');
        if (!id) return;
        window.petrovizUmamiBeforeSend = function (type, payload) {
          var sent = Object.assign({}, payload);
          delete sent.title;
          return sent;
        };
        var tracker = document.createElement('script');
        tracker.setAttribute('src', 'https://analytics.ocortez.com/script.js');
        tracker.setAttribute('data-website-id', id);
        tracker.setAttribute('data-domains', 'petroviz.ocortez.com,petroviz.pages.dev');
        tracker.setAttribute('data-exclude-search', 'true');
        tracker.setAttribute('data-before-send', 'petrovizUmamiBeforeSend');
        document.head.appendChild(tracker);
      })(document.currentScript);
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
