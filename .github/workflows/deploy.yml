name: Deploy to Cloudflare Pages

# main deploys production (petroviz.pages.dev); dev deploys a preview at
# dev.petroviz.pages.dev. Previews read the same production data sources.
on:
  push:
    branches: ["main", "dev"]

  # Allow manual trigger; the branch picked in the UI is the one deployed
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time; a newer push supersedes an older one
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Fail the deploy before building if a source has moved or broken. Any
      # PUBLIC_* overrides belong at job level so this checks what ships.
      - name: Check data sources
        run: pnpm run check:sources

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}

      # A deploy that Cloudflare accepted can still serve the wrong thing, so
      # fetch it. Retries cover the seconds before a new deployment is reachable.
      # The app is client-rendered (ssr = false), so its HTML has no <title>;
      # the SvelteKit bootstrap is the marker that it is the app and not an
      # error page.
      - name: Verify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Checking $DEPLOYMENT_URL"
          code=$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors \
            -o body.html -w '%{http_code}' "$DEPLOYMENT_URL")
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200 from $DEPLOYMENT_URL, got $code"
            exit 1
          fi
          if ! grep -q '__sveltekit' body.html; then
            echo "::error::$DEPLOYMENT_URL returned 200 but not the app's HTML"
            exit 1
          fi
          echo "OK: 200 with the app's HTML"
