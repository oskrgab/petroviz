name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          PUBLIC_DATA_BASE_URL: ${{ vars.PUBLIC_DATA_BASE_URL }}
          PUBLIC_WELLS_PARQUET: ${{ vars.PUBLIC_WELLS_PARQUET }}
          PUBLIC_DAILY_PRODUCTION_PARQUET: ${{ vars.PUBLIC_DAILY_PRODUCTION_PARQUET }}
          PUBLIC_MONTHLY_PRODUCTION_PARQUET: ${{ vars.PUBLIC_MONTHLY_PRODUCTION_PARQUET }}
          PUBLIC_SCHEMA_JSON: ${{ vars.PUBLIC_SCHEMA_JSON }}
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
