# Vite development server for volve-explorer SvelteKit app
# Served via Caddy at dev-volve-explorer.ocortez.com with hot reloading
#
# Usage:
#   Start dev server:  docker compose up --build
#   Stop:              docker compose down
#   Rebuild:           docker compose up --build --force-recreate

services:
  volve-explorer:
    image: volve-explorer
    container_name: volve-explorer
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The container writes into the bind-mounted /app, so it must run as the
        # host user. Defaults suit a stock single-user Linux box; anywhere else
        # (the VPS is 1001) export USER_ID=$(id -u) GROUP_ID=$(id -g) first.
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - .:/app
    restart: "no"
    networks:
      - cluster-network

networks:
  cluster-network:
    name: cluster-network
    external: true
